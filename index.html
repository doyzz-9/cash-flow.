<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JB Cash Flow</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root { --bg-dark: #09090b; --surface-dark: #18181b; --theme-color: #007aff; --text-main: #fafafa; --text-muted: #a1a1aa; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, sans-serif; background: var(--bg-dark); color: var(--text-main); padding-bottom: 100px; }
  
  .topbar { display: flex; align-items: center; gap: 14px; padding: 16px 20px; background: var(--bg-dark); border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 50; }
  .brand { font-weight: 800; font-size: 20px; color: var(--theme-color); white-space: nowrap; }
  .search-wrap { flex: 1; display: flex; align-items: center; background: #111; border-radius: 12px; padding: 10px 14px; gap: 10px; border: 1px solid #333; }
  .search-wrap input { border: none; background: transparent; outline: none; font-size: 14px; width: 100%; color: #fff; }
  .search-icon { font-size: 15px; color: var(--text-muted); }
  
  .scroll-area { padding: 20px 20px 0; }
  .banner-card { border-radius: 20px; overflow: hidden; border: 1px solid #333; }
  .banner-img { display: block; width: 100%; }
  
  .kategori-sec { margin-top: 24px; }
  .kategori-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .kat-item { display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 11px; font-weight: 600; color: var(--text-muted); cursor: pointer; }
  .kat-icon { width: 54px; height: 54px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 22px; background: var(--surface-dark); color: var(--theme-color); border: 1px solid #333; }
  .kat-item.active .kat-icon { background: var(--theme-color); color: #fff; box-shadow: 0 0 15px var(--theme-color); border-color: transparent; }
  .kat-item.active span { color: #fff; font-weight: 700; }
  
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; margin-top: 24px; }
  .card { background: var(--surface-dark); border: 1px solid #333; border-radius: 20px; padding: 12px; display: flex; flex-direction: column; }
  .card-img-wrap { position: relative; width: 100%; aspect-ratio: 1/1; border-radius: 14px; overflow: hidden; margin-bottom: 12px; background: #000; }
  .card-img { width: 100%; height: 100%; object-fit: cover; }
  .promo-badge { position: absolute; top: 8px; left: 8px; background: #ef4444; color: #fff; font-size: 10px; font-weight: 800; padding: 4px 8px; border-radius: 8px; z-index: 2; }
  .card .name { font-size: 14px; font-weight: 700; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; }
  .price-wrap { margin-top: auto; display: flex; flex-direction: column; }
  .price-old { font-size: 11px; color: var(--text-muted); text-decoration: line-through; margin-bottom: 2px; }
  .price { font-size: 16px; font-weight: 800; color: var(--theme-color); }
  
  .wa-btn { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 14px; padding: 10px; background: #10b981; color: #fff; font-weight: 700; font-size: 13px; border-radius: 12px; text-decoration: none; }
  
  .bottom-nav { position: fixed; bottom: 20px; left: 20px; right: 20px; display: flex; justify-content: space-around; background: var(--surface-dark); border-radius: 24px; padding: 10px; border: 1px solid #333; z-index: 60; }
  .bn-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; color: var(--text-muted); text-decoration: none; padding: 8px 20px; border-radius: 16px; }
  .bn-item i { font-size: 20px; }
  .bn-item.active { color: var(--theme-color); background: rgba(0,122,255,0.1); }
  
  .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .modal-overlay.show { opacity: 1; pointer-events: auto; }
  .modal-content { background: var(--surface-dark); width: 100%; border-radius: 32px 32px 0 0; padding: 24px; max-height: 80vh; border-top: 1px solid #333; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">JB CASH FLOW</div>
  <div class="search-wrap">
    <i class="fa-solid fa-magnifying-glass search-icon"></i>
    <input type="text" id="search-input" placeholder="Cari akun, item...">
  </div>
</header>

<div class="scroll-area">
  <div class="banner-card">
    <img src="https://cdn.imagetourls.com/uploads/tyImg/FPWXGXn3.jpg" class="banner-img">
  </div>

  <section class="kategori-sec">
    <div class="kategori-grid" id="category-list">
      <div class="kat-item active" onclick="filterCategory('Semua', this)"><div class="kat-icon"><i class="fa-solid fa-layer-group"></i></div><span>SEMUA</span></div>
      <div class="kat-item" onclick="filterCategory('Free Fire', this)"><div class="kat-icon"><i class="fa-solid fa-fire"></i></div><span>FREE FIRE</span></div>
      <div class="kat-item" onclick="filterCategory('Mobile Legends', this)"><div class="kat-icon"><i class="fa-solid fa-shield-halved"></i></div><span>MLBB</span></div>
      <div class="kat-item" onclick="filterCategory('Flash Sale', this)"><div class="kat-icon"><i class="fa-solid fa-bolt"></i></div><span>FLASH SALE</span></div>
      <div class="kat-item" onclick="filterCategory('Pelajar', this)"><div class="kat-icon"><i class="fa-solid fa-graduation-cap"></i></div><span>PELAJAR</span></div>
    </div>
  </section>

  <section>
    <div id="product-grid" class="grid"></div>
  </section>
</div>

<nav class="bottom-nav">
  <a href="#" class="bn-item active" onclick="openModal('beranda')"><i class="fa-solid fa-house"></i><span>BERANDA</span></a>
  <a href="#" class="bn-item" onclick="openModal('bantuan')"><i class="fa-solid fa-circle-question"></i><span>BANTUAN</span></a>
</nav>

<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <h3 id="modal-title" style="text-align:center; margin-bottom: 20px; color: #fff;">Bantuan</h3>
    <div id="modal-body" style="font-size:15px; line-height:1.6; color: var(--text-muted); text-align: center;"></div>
  </div>
</div>

<!-- FIREBASE SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // GANTI PAKE CONFIG DARI FIREBASE LO
  const firebaseConfig = {
    apiKey: "MASUKIN_API_KEY_LO",
    authDomain: "MASUKIN_AUTH_DOMAIN_LO",
    projectId: "MASUKIN_PROJECT_ID_LO",
    storageBucket: "MASUKIN_BUCKET_LO",
    messagingSenderId: "MASUKIN_SENDER_ID_LO",
    appId: "MASUKIN_APP_ID_LO"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.fetchProductsFromFirebase = function(callback) {
    onSnapshot(collection(db, "products"), (snapshot) => {
      const prods = [];
      snapshot.forEach(doc => prods.push({ id: doc.id, ...doc.data() }));
      callback(prods);
    });
  }
</script>

<script>
  let allProducts = [];
  let currentCategory = 'Semua';
  const themeColors = { 'Semua': '#007aff', 'Free Fire': '#ef4444', 'Mobile Legends': '#8b5cf6', 'Flash Sale': '#f59e0b', 'Pelajar': '#007aff' };
  const grid = document.getElementById('product-grid');
  const searchInput = document.getElementById('search-input');

  function formatRupiah(n) { return 'Rp ' + Number(n).toLocaleString('id-ID'); }

  function renderProducts() {
    let filtered = allProducts;
    if (currentCategory !== 'Semua') filtered = filtered.filter(p => p.kategori === currentCategory);
    const q = searchInput.value.toLowerCase();
    if (q) filtered = filtered.filter(p => p.name.toLowerCase().includes(q));

    if (!filtered.length) {
      grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px 0; opacity: 0.4;"><p style="font-size: 15px; color: var(--text-muted);">Belum ada produk.</p></div>`;
      return;
    }

    grid.innerHTML = filtered.map((p) => {
      let discountPct = "";
      if (p.old_price && p.old_price > p.price) discountPct = Math.round(((p.old_price - p.price) / p.old_price) * 100) + "% OFF";
      const waText = `Halo%20Admin%20JB%20Cash%20Flow,%20saya%20tertarik%20untuk%20membeli%20produk%20*${encodeURIComponent(p.name)}*.%20Apakah%20stoknya%20masih%20ada?`;

      return `
      <div class="card">
        <div class="card-img-wrap">
          ${discountPct ? `<div class="promo-badge">${discountPct}</div>` : ''}
          <img src="${p.image || 'https://placehold.co/400x400/18181b/a1a1aa?text=No+Img'}" class="card-img" loading="lazy">
        </div>
        <div class="name">${p.name}</div>
        <div class="price-wrap">
          ${p.old_price ? `<span class="price-old">${formatRupiah(p.old_price)}</span>` : ''}
          <div class="price">${formatRupiah(p.price)}</div>
        </div>
        <a class="wa-btn" href="https://wa.me/${p.wa}?text=${waText}" target="_blank">
          <i class="fa-brands fa-whatsapp"></i> BELI
        </a>
      </div>`;
    }).join('');
  }

  function filterCategory(cat, el) {
    currentCategory = cat;
    const color = themeColors[cat];
    document.documentElement.style.setProperty('--theme-color', color);
    document.querySelectorAll('.kat-item').forEach(item => item.classList.remove('active'));
    if(el) el.classList.add('active');
    renderProducts();
  }

  searchInput.addEventListener('input', renderProducts);

  const overlay = document.getElementById('modal-overlay');
  function openModal(type) {
    if (type === 'beranda') {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      document.querySelectorAll('.bn-item')[0].classList.add('active');
      document.querySelectorAll('.bn-item')[1].classList.remove('active');
      return;
    }
    if (type === 'bantuan') {
      document.querySelectorAll('.bn-item')[1].classList.add('active');
      document.querySelectorAll('.bn-item')[0].classList.remove('active');
      document.getElementById('modal-body').innerText = "Hubungi admin JB Cash Flow di +62 883-8003-5722 untuk bantuan.";
      overlay.classList.add('show');
    }
  }

  function closeModal(e) {
    if (e.target.id === 'modal-overlay') overlay.classList.remove('show');
  }

  // Tarik data dari Firebase (Real-time)
  window.fetchProductsFromFirebase((data) => {
    allProducts = data;
    renderProducts();
  });
</script>
</body>
</html>
